[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-zoo-garden"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "pyarrow",
  "pyyaml",
  "tushare",
  "matplotlib",
]

[project.scripts]
zoo-index = "zoo_index.cli:main"
zoo-chart = "redraw_chart:main"
zoo-audit = "zoo_index.cli:audit_main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["run_daily", "redraw_chart"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --cov=zoo_index --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PERF", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty]
