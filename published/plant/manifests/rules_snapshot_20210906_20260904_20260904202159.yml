# 植物园规则分为核心词和扩展词。核心词语义明确，扩展词用于增加覆盖面。
strict_keywords:
  - 兰花
  - 梅花
  - 棕榈
  - 银杏
  - 牡丹
  - 莲花
  - 荷花
  - 桂花
  - 椰树
  - 红豆杉
  - 香梨

# 暂不启用单字植物词，避免松、竹、杉、柏、茶、药等造成大量品牌或行业误匹配。
# 下面只加入语义明确的多字词。
extended_keywords:
  - 桃李
  - 百合
  - 青松
  - 茶花
  - 紫竹
  - 凤竹
  - 龙竹
  - 金叶

exclude_patterns:
  - 梅钢
  - 兰州
  - 桂林
  - 香江

force_include: []
force_exclude: []

exclude_st: true
allow_beijing: false
