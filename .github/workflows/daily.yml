name: zoo-index-daily

on:
  schedule:
    - cron: "10 8 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill_mode:
        description: "回填模式：missing 只补缺失日期，all 重算指定历史区间"
        required: false
        default: missing
        type: choice
        options:
          - missing
          - all
      backfill_days:
        description: "手动回填交易日数量；默认 1，仅刷新最近交易日"
        required: false
        default: "1"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: zoo-index-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - name: Install Python deps
        run: uv sync --frozen

      - name: Compute index (更新最近交易日)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          BACKFILL_MODE: ${{ inputs.backfill_mode || 'missing' }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '1' }}
        run: uv run python -m zoo_index --output-dir published --backfill "$BACKFILL_DAYS" --backfill-mode "$BACKFILL_MODE"

      - name: Compute plant index (更新最近交易日)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          BACKFILL_MODE: ${{ inputs.backfill_mode || 'missing' }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '1' }}
        run: uv run python -m zoo_index --rules plant_rules.yml --output-dir published/plant --backfill "$BACKFILL_DAYS" --backfill-mode "$BACKFILL_MODE"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published
          git diff --cached --quiet && echo "无数据变更" || git commit -m "chore: 每日数据更新"

      - name: Push data
        if: success()
        run: git push

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
