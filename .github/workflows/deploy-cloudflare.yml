name: deploy-cloudflare

on:
  workflow_dispatch:
  # 如需与主分支推送联动，取消下面注释，并自备 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID。
  # push:
  #   branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: uv sync --frozen

      - name: Compute index
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: uv run python -m zoo_index --output-dir .build/data --backfill

      - name: Prepare web data
        run: |
          mkdir -p web/public/data
          cp .build/data/*.json web/public/data/

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=a-share-animal-index
